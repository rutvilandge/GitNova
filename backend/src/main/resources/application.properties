spring.application.name=gitnova
spring.config.import=optional:file:../.env[.properties]
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gitnova}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email,repo
spring.security.oauth2.client.registration.github.redirect-uri=${BACKEND_URL:http://localhost:8080}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login
gitnova.frontend-url=${FRONTEND_URL:http://localhost:5173}
gitnova.backend-url=${BACKEND_URL:http://localhost:8080}
gitnova.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
gitnova.groq-api-key=${GROQ_API_KEY:}
gitnova.groq-model=${GROQ_MODEL:openai/gpt-oss-20b}
gitnova.gemini-api-key=${GEMINI_API_KEY:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
